<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Controle Financeiro</title>
  
  <!-- Estilos da Interface -->
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1, h2 { color: #1a2a3a; margin-top: 0; }
    
    /* Form Mapeamento */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { background-color: #2b6cb0; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #2c5282; }
    
    /* Estilos das Telas de Bloqueio/Login */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-card { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
    .pin-input { font-size: 24px; text-align: center; letter-spacing: 10px; margin: 15px 0; }
    .hidden { display: none !important; }
    .error-msg { color: #e53e3e; font-size: 14px; margin-top: 10px; }
    
    /* Tabela de Lançamentos */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background-color: #f7fafc; }
    .entrada { color: #38a169; font-weight: bold; }
    .saida { color: #e53e3e; font-weight: bold; }
  </style>

  <!-- SDKs do Firebase (Versão Compatível) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- ==================== TELA DE CONFIGURAÇÃO INICIAL (1º ACESSO) ==================== -->
  <div id="modal-setup" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Primeiro Acesso</h2>
      <p style="font-size: 14px; color: #666;">Insira suas credenciais do Firebase e defina um PIN de 6 dígitos para este aparelho.</p>
      <form id="form-setup">
        <div class="form-group">
          <input type="email" id="setup-email" placeholder="Seu e-mail do Firebase" required>
        </div>
        <div class="form-group">
          <input type="password" id="setup-password" placeholder="Sua senha do Firebase" required>
        </div>
        <div class="form-group">
          <input type="password" id="setup-pin" class="pin-input" maxlength="6" placeholder="******" pattern="\d{6}" required>
        </div>
        <button type="submit">Cadastrar e Entrar</button>
      </form>
      <div id="setup-error" class="error-msg"></div>
    </div>
  </div>

  <!-- ==================== TELA DE DESBLOQUEIO VIA PIN ==================== -->
  <div id="modal-pin" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Digite o seu PIN</h2>
      <p style="font-size: 14px; color: #666;">Insira o PIN de 6 dígitos para liberar o acesso.</p>
      <form id="form-pin">
        <div class="form-group">
          <input type="password" id="input-pin" class="pin-input" maxlength="6" placeholder="******" pattern="\d{6}" autofocus required>
        </div>
        <button type="submit">Desbloquear</button>
      </form>
      <div id="pin-error" class="error-msg"></div>
      <p style="margin-top: 15px;"><a href="#" id="link-reset" style="color: #2b6cb0; font-size: 12px;">Resetar login neste aparelho</a></p>
    </div>
  </div>

  <!-- ==================== APLICAÇÃO PRINCIPAL ==================== -->
  <div id="app-content" class="container hidden">
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
      <h1>Controle Financeiro</h1>
      <button id="btn-logout" style="width: auto; padding: 8px 16px; background-color: #718096;">Sair</button>
    </div>

    <!-- Form de Novo Lançamento -->
    <div class="card">
      <h2>Novo Lançamento</h2>
      <form id="form-financeiro">
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Mercado, Salário, Luz" required>
        </div>
        <div class="form-group">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" step="0.01" placeholder="0.00" required>
        </div>
        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="saida">Saída (Despesa)</option>
            <option value="entrada">Entrada (Receita)</option>
          </select>
        </div>
        <button type="submit">Salvar Lançamento</button>
      </form>
    </div>

    <!-- Lista de Lançamentos -->
    <div class="card">
      <h2>Histórico</h2>
      <table>
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="tabela-dados">
          <!-- Os lançamentos serão carregados dinamicamente aqui -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ==================== LÓGICA EM JAVASCRIPT ==================== -->
  <script>
    // 1. CONFIGURAÇÃO DO FIREBASE (Substitua pelos seus dados do console do Firebase)
    const firebaseConfig = {
  apiKey: "AIzaSyDDf0eXdNJ0G-yw-uSvb8WXbEBPpIANnoo",
  authDomain: "meu-controle-financeiro-af5ef.firebaseapp.com",
  projectId: "meu-controle-financeiro-af5ef",
  storageBucket: "meu-controle-financeiro-af5ef.firebasestorage.app",
  messagingSenderId: "663422499675",
  appId: "1:663422499675:web:7c32308ae95f5bbaff387e"
};


    // Inicialização
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Referências do DOM
    const modalSetup = document.getElementById('modal-setup');
    const modalPin = document.getElementById('modal-pin');
    const appContent = document.getElementById('app-content');
    const formSetup = document.getElementById('form-setup');
    const formPin = document.getElementById('form-pin');
    const formFinanceiro = document.getElementById('form-financeiro');
    const btnLogout = document.getElementById('btn-logout');
    const linkReset = document.getElementById('link-reset');

    // Chave para armazenar o PIN no navegador local do aparelho
    const LOCAL_PIN_KEY = 'finances_app_pin';

    // 2. GERENCIAMENTO DE AUTENTICAÇÃO E PIN
    auth.onAuthStateChanged((user) => {
      const savedPin = localStorage.getItem(LOCAL_PIN_KEY);

      if (!user || !savedPin) {
        // Se não estiver logado no Firebase ou não tiver PIN configurado no aparelho
        modalSetup.classList.remove('hidden');
        modalPin.classList.add('hidden');
        appContent.classList.add('hidden');
      } else {
        // Se estiver autenticado e com PIN salvo, solicita o PIN de desbloqueio
        modalSetup.classList.add('hidden');
        modalPin.classList.remove('hidden');
        appContent.classList.add('hidden');
      }
    });

    // Evento de Registro Inicial (Primeiro Acesso)
    formSetup.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('setup-email').value;
      const password = document.getElementById('setup-password').value;
      const pin = document.getElementById('setup-pin').value;
      const errorDiv = document.getElementById('setup-error');

      try {
        errorDiv.innerText = '';
        await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem(LOCAL_PIN_KEY, pin);
        modalSetup.classList.add('hidden');
        appContent.classList.remove('hidden');
        carregarDados();
      } catch (error) {
        errorDiv.innerText = "Erro ao autenticar: " + error.message;
      }
    });

    // Evento de Validação do PIN (Acessos Seguintes)
    formPin.addEventListener('submit', (e) => {
      e.preventDefault();
      const inputPin = document.getElementById('input-pin').value;
      const savedPin = localStorage.getItem(LOCAL_PIN_KEY);
      const errorDiv = document.getElementById('pin-error');

      if (inputPin === savedPin) {
        modalPin.classList.add('hidden');
        appContent.classList.remove('hidden');
        carregarDados();
      } else {
        errorDiv.innerText = "PIN incorreto. Tente novamente.";
        document.getElementById('input-pin').value = '';
      }
    });

    // Resetar login / Trocar de usuário
    linkReset.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem(LOCAL_PIN_KEY);
      auth.signOut();
      location.reload();
    });

    btnLogout.addEventListener('click', () => {
      modalPin.classList.remove('hidden');
      appContent.classList.add('hidden');
      document.getElementById('input-pin').value = '';
    });

    // 3. OPERAÇÕES NO FIRESTORE (BANCO DE DADOS)

    // Salvar novo lançamento
    formFinanceiro.addEventListener('submit', async (e) => {
      e.preventDefault();
      const descricao = document.getElementById('descricao').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const tipo = document.getElementById('tipo').value;

      try {
        await db.collection('financeiro').add({
          descricao: descricao,
          valor: valor,
          tipo: tipo,
          data: firebase.firestore.FieldValue.serverTimestamp()
        });

        formFinanceiro.reset();
      } catch (error) {
        alert("Erro ao salvar dados no Firebase: " + error.message);
      }
    });

    // Carregar dados em tempo real
    function carregarDados() {
      db.collection('financeiro').orderBy('data', 'desc').onSnapshot((snapshot) => {
        const tabela = document.getElementById('tabela-dados');
        tabela.innerHTML = '';

        snapshot.forEach((doc) => {
          const item = doc.data();
          const tr = document.createElement('tr');
          
          const valorFormatado = item.valor ? item.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : 'R$ 0,00';
          const classeTipo = item.tipo === 'entrada' ? 'entrada' : 'saida';

          tr.innerHTML = `
            <td>${item.descricao}</td>
            <td class="${classeTipo}">${item.tipo.toUpperCase()}</td>
            <td>${valorFormatado}</td>
          `;
          tabela.appendChild(tr);
        });
      }, (error) => {
        console.error("Erro ao ler coleção:", error);
      });
    }
  </script>
</body>
</html>
